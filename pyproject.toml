[project]
name = "bloom-maternal-health"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "SQLAlchemy==2.0.41",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.5",
]

[project.optional-dependencies]
model = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scikit-learn==1.9.0",
  "torch==2.14.1",
]
test = ["pytest==8.3.5", "httpx==0.28.1"]

[tool.vercel]
entrypoint = "backend.main:app"

[tool.vercel.fastapi.static]
cdn = false
